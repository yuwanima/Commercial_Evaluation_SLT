<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComOps</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<header><div class="wrap"><h1>Commericial Evaluation</h1><a href="/chatbot" class="btn">ContractWise AI</a></div></header>
<main><div class="wrap">
  <nav class="tabs" role="tablist"><button type="button" class="on" data-tab="all" role="tab">Technical Evaluation Reports / GCC & SCC Compliance Reports / Price Documents</button></nav>
  <div class="panel" id="p-all">
    <section><h2>Upload all tender documents</h2><p class="sub">Upload GCC, SCC, technical evaluation reports, and price documents together. The system will identify and process each document.</p>
      <div class="zone"><b>Drop documents or folders here</b><span>.xlsx · .xls · .docx · .doc · .pdf · .zip</span></div>
      <div class="pick"><label>Choose files<input class="f-files" type="file" multiple accept=".xlsx,.xlsm,.xls,.docx,.doc,.pdf,.zip"></label><label>Choose folder<input class="f-dir" type="file" webkitdirectory multiple></label></div>
      <ul class="files"></ul><div class="count"></div></section>
    <div class="actions"><button class="btn go" type="button">Process all documents</button></div><div class="out"></div>
  </div>
</div></main>
<script src="index.js"></script>
</body>
</html>
